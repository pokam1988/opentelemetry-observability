name: Deploy OpenTelemetry Demo to OpenShift

on:
  push:
    branches: [ main, develop, feature* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
        - dev
        - staging
        - prod

env:
  # OpenShift cluster details
  OPENSHIFT_SERVER: https://api.rm1.0a51.p1.openshiftapps.com:6443
  OPENSHIFT_NAMESPACE: pokamr-dev
  # Application configuration
  APP_NAME: otel-demo
  CHART_PATH: ./charts/opentelemetry-demo
  VALUES_FILE: ./charts/opentelemetry-demo/ocp-values.yaml

jobs:
  # Validation and testing job
  validate:
    runs-on: ubuntu-latest
    name: Validate Configuration
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Helm
      uses: azure/setup-helm@v4
      with:
        version: '3.14.0'
        
    - name: Add Helm repositories
      run: |
        helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
        helm repo add grafana https://grafana.github.io/helm-charts
        helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
        helm repo add jaeger https://jaegertracing.github.io/helm-charts
        helm repo add opensearch https://opensearch-project.github.io/helm-charts
        helm repo update
        
    - name: Validate Helm chart dependencies
      run: |
        cd ${{ env.CHART_PATH }}
        helm dependency build
        
    - name: Lint Helm chart
      run: |
        helm lint ${{ env.CHART_PATH }} -f ${{ env.VALUES_FILE }}
        
    - name: Validate Kubernetes manifests
      run: |
        helm template ${{ env.APP_NAME }} ${{ env.CHART_PATH }} \
          -f ${{ env.VALUES_FILE }} \
          --namespace ${{ env.OPENSHIFT_NAMESPACE }} > /tmp/manifests.yaml
        echo "Generated manifests:"
        head -50 /tmp/manifests.yaml

  # Security scanning job
  security:
    runs-on: ubuntu-latest
    name: Security Scan
    needs: validate
    permissions:
      # Add necessary permissions for CodeQL/SARIF upload
      security-events: write
      actions: read
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'config'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always() && github.event_name != 'pull_request' # Skip upload for PRs from forks
      with:
        sarif_file: 'trivy-results.sarif'
        category: 'trivy-config-scan'
        
    - name: Upload scan results as artifact (fallback)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: trivy-security-scan-results
        path: 'trivy-results.sarif'
        retention-days: 30

  # Deployment job for dev environment
  deploy-dev:
    runs-on: ubuntu-latest
    name: Deploy to Development
    needs: [validate, security]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment: dev
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup OpenShift CLI
      uses: redhat-actions/openshift-tools-installer@v1
      with:
        oc: "4.14"
        
    - name: Setup Helm
      uses: azure/setup-helm@v4
      with:
        version: '3.14.0'
        
    - name: Login to OpenShift
      run: |
        echo "Logging into OpenShift cluster..."
        oc login --token=${{ secrets.OPENSHIFT_TOKEN }} --server=${{ env.OPENSHIFT_SERVER }}
        oc project ${{ env.OPENSHIFT_NAMESPACE }} || oc new-project ${{ env.OPENSHIFT_NAMESPACE }}
        
    - name: Add Helm repositories
      run: |
        echo "Adding Helm repositories..."
        helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
        helm repo add grafana https://grafana.github.io/helm-charts
        helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
        helm repo add jaeger https://jaegertracing.github.io/helm-charts
        helm repo add opensearch https://opensearch-project.github.io/helm-charts
        helm repo update
        
    - name: Build Helm dependencies
      run: |
        echo "Building Helm chart dependencies..."
        cd ${{ env.CHART_PATH }}
        helm dependency build

    - name: Cleanup conflicting Kubernetes objects
      run: |
        echo "Checking and cleaning up conflicting objects..."
        # Check if ServiceAccount 'grafana' exists and belongs to a different release
        if oc get sa grafana -n ${{ env.OPENSHIFT_NAMESPACE }} 2>/dev/null; then
          echo "Found existing ServiceAccount 'grafana', checking release ownership..."
          RELEASE_NAME=$(oc get sa grafana -n ${{ env.OPENSHIFT_NAMESPACE }} -o jsonpath='{.metadata.annotations.meta\.helm\.sh/release-name}' 2>/dev/null || echo "")
          
          if [ "$RELEASE_NAME" != "${{ env.APP_NAME }}" ] && [ -n "$RELEASE_NAME" ]; then
            echo "ServiceAccount is owned by release '$RELEASE_NAME', not '${{ env.APP_NAME }}'"
            echo "Fixing Helm ownership metadata..."
            
            # Patch the ServiceAccount to update Helm annotations
            kubectl annotate serviceaccount grafana \
              --namespace ${{ env.OPENSHIFT_NAMESPACE }} \
              meta.helm.sh/release-name=${{ env.APP_NAME }} \
              meta.helm.sh/release-namespace=${{ env.OPENSHIFT_NAMESPACE }} \
              --overwrite 2>/dev/null || true
            
            kubectl label serviceaccount grafana \
              --namespace ${{ env.OPENSHIFT_NAMESPACE }} \
              app.kubernetes.io/managed-by=Helm \
              --overwrite 2>/dev/null || true
              
            echo "✅ ServiceAccount ownership updated"
          fi
        fi
        
        # Apply alternative solution: annotate with cleanup if needed
        echo "Checking other Helm-managed objects for ownership issues..."
        oc get serviceaccounts -n ${{ env.OPENSHIFT_NAMESPACE }} -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' | while read sa; do
          RELEASE=$(oc get sa "$sa" -n ${{ env.OPENSHIFT_NAMESPACE }} -o jsonpath='{.metadata.annotations.meta\.helm\.sh/release-name}' 2>/dev/null || echo "")
          if [ "$RELEASE" = "grafana" ] && [ "$sa" != "grafana" ]; then
            echo "Fixing ServiceAccount $sa owned by 'grafana' release..."
            kubectl annotate serviceaccount "$sa" \
              --namespace ${{ env.OPENSHIFT_NAMESPACE }} \
              meta.helm.sh/release-name=${{ env.APP_NAME }} \
              --overwrite 2>/dev/null || true
          fi
        done
        
    - name: Deploy OpenTelemetry Demo
      run: |
        echo "Deploying OpenTelemetry Demo application..."
        helm upgrade --install ${{ env.APP_NAME }} ${{ env.CHART_PATH }} \
          --namespace ${{ env.OPENSHIFT_NAMESPACE }} \
          -f ${{ env.VALUES_FILE }} \
          --wait --timeout=10m \
          --atomic \
          --cleanup-on-fail
        
        echo "Checking services:"
        oc get svc -n ${{ env.OPENSHIFT_NAMESPACE }} -l app.kubernetes.io/instance=${{ env.APP_NAME }}
        
        echo "Checking routes:"
        oc get routes -n ${{ env.OPENSHIFT_NAMESPACE }} || true
        
        echo "Waiting for pods to be ready..."
        oc wait --for=condition=Ready pod -l app.kubernetes.io/instance=${{ env.APP_NAME }} \
          -n ${{ env.OPENSHIFT_NAMESPACE }} --timeout=300s
          
    - name: Run Health Checks
      run: |
        echo "Running application health checks..."
        
        # Check if frontend is accessible via route
        FRONTEND_ROUTE=$(oc get route frontend -n ${{ env.OPENSHIFT_NAMESPACE }} -o jsonpath='{.spec.host}' 2>/dev/null || echo "")
        if [ -n "$FRONTEND_ROUTE" ]; then
          echo "Testing frontend route: https://$FRONTEND_ROUTE"
          curl -f -s -o /dev/null https://$FRONTEND_ROUTE || echo "Frontend health check failed"
        fi
        
        # Check Grafana accessibility
        GRAFANA_ROUTE=$(oc get route grafana -n ${{ env.OPENSHIFT_NAMESPACE }} -o jsonpath='{.spec.host}' 2>/dev/null || echo "")
        if [ -n "$GRAFANA_ROUTE" ]; then
          echo "Testing Grafana route: https://$GRAFANA_ROUTE"
          curl -f -s -o /dev/null https://$GRAFANA_ROUTE || echo "Grafana health check failed"
        fi
        
        # Check collector metrics
        echo "Checking OpenTelemetry Collector logs:"
        oc logs deployment/otel-collector -n ${{ env.OPENSHIFT_NAMESPACE }} --tail=10 || true
        
    - name: Generate Deployment Summary
      run: |
        echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Environment:** Development" >> $GITHUB_STEP_SUMMARY
        echo "**Namespace:** ${{ env.OPENSHIFT_NAMESPACE }}" >> $GITHUB_STEP_SUMMARY
        echo "**Application:** ${{ env.APP_NAME }}" >> $GITHUB_STEP_SUMMARY
        echo "**Release Date:** $(date)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        echo "### 📊 Pod Status" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        oc get pods -n ${{ env.OPENSHIFT_NAMESPACE }} -l app.kubernetes.io/instance=${{ env.APP_NAME }} --no-headers | head -15 >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        echo "### 🔗 Access URLs" >> $GITHUB_STEP_SUMMARY
        echo "| Service | URL |" >> $GITHUB_STEP_SUMMARY
        echo "|---------|-----|" >> $GITHUB_STEP_SUMMARY
        
        # Get all routes and display them
        oc get routes -n ${{ env.OPENSHIFT_NAMESPACE }} -o jsonpath='{range .items[*]}{.metadata.name}{ "|" }{.spec.host}{"\n"}{end}' | while IFS='|' read -r service host; do
          if [ -n "$service" ] && [ -n "$host" ]; then
            echo "| $service | https://$host |" >> $GITHUB_STEP_SUMMARY
          fi
        done
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📈 Quick Links" >> $GITHUB_STEP_SUMMARY
        FRONTEND_ROUTE=$(oc get route frontend -n ${{ env.OPENSHIFT_NAMESPACE }} -o jsonpath='{.spec.host}' 2>/dev/null || echo "")
        if [ -n "$FRONTEND_ROUTE" ]; then
          echo "- **Frontend:** https://$FRONTEND_ROUTE" >> $GITHUB_STEP_SUMMARY
        fi
        GRAFANA_ROUTE=$(oc get route grafana -n ${{ env.OPENSHIFT_NAMESPACE }} -o jsonpath='{.spec.host}' 2>/dev/null || echo "")
        if [ -n "$GRAFANA_ROUTE" ]; then
          echo "- **Grafana Dashboards:** https://$GRAFANA_ROUTE" >> $GITHUB_STEP_SUMMARY
        fi
        PROMETHEUS_ROUTE=$(oc get route prometheus -n ${{ env.OPENSHIFT_NAMESPACE }} -o jsonpath='{.spec.host}' 2>/dev/null || echo "")
        if [ -n "$PROMETHEUS_ROUTE" ]; then
          echo "- **Prometheus Metrics:** https://$PROMETHEUS_ROUTE" >> $GITHUB_STEP_SUMMARY
        fi

  # Deploy with Helm directly
  deploy-helm:
    runs-on: ubuntu-latest
    name: Deploy with Helm
    needs: [validate, security]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup OpenShift CLI
      uses: redhat-actions/openshift-tools-installer@v1
      with:
        oc: "4.14"
        
    - name: Setup Helm
      uses: azure/setup-helm@v4
      with:
        version: '3.14.0'
        
    - name: Login to OpenShift
      run: |
        echo "Logging into OpenShift cluster..."
        oc login --token=${{ secrets.OPENSHIFT_TOKEN }} --server=${{ env.OPENSHIFT_SERVER }}
        oc project ${{ env.OPENSHIFT_NAMESPACE }} || oc new-project ${{ env.OPENSHIFT_NAMESPACE }}
        
    - name: Add Helm repositories
      run: |
        echo "Adding Helm repositories..."
        helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
        helm repo add grafana https://grafana.github.io/helm-charts
        helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
        helm repo add jaeger https://jaegertracing.github.io/helm-charts
        helm repo add opensearch https://opensearch-project.github.io/helm-charts
        helm repo update
        
    - name: Build Helm dependencies
      run: |
        echo "Building Helm chart dependencies..."
        cd ${{ env.CHART_PATH }}
        helm dependency build
        cd ../../..
        
    - name: Cleanup old Helm releases
      run: |
        echo "🧹 Cleaning up old Helm releases from previous deployments..."
        OLD_RELEASES=("grafana" "tempo" "prometheus" "loki" "jaeger" "opensearch" "otel-collector-backend" "otel-collector-gateway" "blackbox-exporter" "prometheus-operator")
        
        for release in "${OLD_RELEASES[@]}"; do
          if helm list -n ${{ env.OPENSHIFT_NAMESPACE }} | grep -q "^$release "; then
            echo "Uninstalling conflicting release: $release"
            helm uninstall "$release" -n ${{ env.OPENSHIFT_NAMESPACE }} --wait || true
          fi
        done
        
        echo "✅ Cleanup completed"
        
    - name: Cleanup conflicting Kubernetes objects
      run: |
        echo "Checking and cleaning up conflicting objects..."
        # Check if ServiceAccount 'grafana' exists and belongs to a different release
        if oc get sa grafana -n ${{ env.OPENSHIFT_NAMESPACE }} 2>/dev/null; then
          echo "Found existing ServiceAccount 'grafana', checking release ownership..."
          RELEASE_NAME=$(oc get sa grafana -n ${{ env.OPENSHIFT_NAMESPACE }} -o jsonpath='{.metadata.annotations.meta\.helm\.sh/release-name}' 2>/dev/null || echo "")
          
          if [ "$RELEASE_NAME" != "${{ env.APP_NAME }}" ] && [ -n "$RELEASE_NAME" ]; then
            echo "ServiceAccount is owned by release '$RELEASE_NAME', not '${{ env.APP_NAME }}'"
            echo "Fixing Helm ownership metadata..."
            
            # Patch the ServiceAccount to update Helm annotations
            kubectl annotate serviceaccount grafana \
              --namespace ${{ env.OPENSHIFT_NAMESPACE }} \
              meta.helm.sh/release-name=${{ env.APP_NAME }} \
              meta.helm.sh/release-namespace=${{ env.OPENSHIFT_NAMESPACE }} \
              --overwrite 2>/dev/null || true
            
            kubectl label serviceaccount grafana \
              --namespace ${{ env.OPENSHIFT_NAMESPACE }} \
              app.kubernetes.io/managed-by=Helm \
              --overwrite 2>/dev/null || true
              
            echo "✅ ServiceAccount ownership updated"
          fi
        fi
        
    - name: Deploy OpenTelemetry Demo with Helm
      run: |
        echo "🚀 Deploying OpenTelemetry Demo to ${{ env.OPENSHIFT_NAMESPACE }}..."
        helm upgrade --install ${{ env.APP_NAME }} ${{ env.CHART_PATH }} \
          --namespace ${{ env.OPENSHIFT_NAMESPACE }} \
          --create-namespace \
          -f ${{ env.VALUES_FILE }} \
          --wait --timeout=10m \
          --cleanup-on-fail
        
        echo "✅ Helm deployment completed"
        
    - name: Create OpenShift Routes
      run: |
        echo "🌐 Creating OpenShift Routes for all services..."
        
        # Get all services deployed by otel-demo
        SERVICES=$(oc get svc -n ${{ env.OPENSHIFT_NAMESPACE }} -l app.kubernetes.io/instance=${{ env.APP_NAME }} -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}')
        
        # List of services that should be exposed via routes
        EXPOSE_SERVICES=("frontend" "frontend-proxy" "grafana" "prometheus" "jaeger-query" "tempo")
        
        for service in $SERVICES; do
          # Check if service should be exposed
          SHOULD_EXPOSE=false
          for expose_srv in "${EXPOSE_SERVICES[@]}"; do
            if [[ "$service" == *"$expose_srv"* ]]; then
              SHOULD_EXPOSE=true
              break
            fi
          done
          
          if [ "$SHOULD_EXPOSE" = true ]; then
            # Check if route already exists
            if ! oc get route "$service" -n ${{ env.OPENSHIFT_NAMESPACE }} 2>/dev/null; then
              echo "Creating route for service: $service"
              
              # Get service port
              PORT=$(oc get svc "$service" -n ${{ env.OPENSHIFT_NAMESPACE }} -o jsonpath='{.spec.ports[0].port}')
              
              # Create route with edge termination for HTTPS
              oc expose svc "$service" \
                -n ${{ env.OPENSHIFT_NAMESPACE }} \
                --port="$PORT" \
                --name="$service" 2>/dev/null || true
              
              # Configure TLS termination
              oc patch route "$service" -n ${{ env.OPENSHIFT_NAMESPACE }} -p '{"spec":{"tls":{"termination":"edge","insecureEdgeTerminationPolicy":"Redirect"}}}' || true
              
              echo "✅ Route created for $service"
            else
              echo "Route already exists for $service"
            fi
          fi
        done
        
    - name: Verify Helm Deployment
      run: |
        echo "📊 Verifying Helm deployment..."
        helm status ${{ env.APP_NAME }} -n ${{ env.OPENSHIFT_NAMESPACE }}
        
        echo ""
        echo "📦 Deployed Pods:"
        oc get pods -n ${{ env.OPENSHIFT_NAMESPACE }} -l app.kubernetes.io/instance=${{ env.APP_NAME }} --no-headers | head -20
        
        echo ""
        echo "🌐 Available Routes:"
        oc get routes -n ${{ env.OPENSHIFT_NAMESPACE }} --no-headers | head -20

  # Cleanup job for PR deployments
  cleanup:
    runs-on: ubuntu-latest
    name: Cleanup PR Environment
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    
    steps:
    - name: Setup OpenShift CLI
      uses: redhat-actions/openshift-tools-installer@v1
      with:
        oc: "4.14"
        
    - name: Login to OpenShift
      run: |
        oc login --token=${{ secrets.OPENSHIFT_TOKEN }} --server=${{ env.OPENSHIFT_SERVER }}
        
    - name: Cleanup PR resources
      run: |
        PR_NAMESPACE="pr-${{ github.event.number }}"
        if oc get project $PR_NAMESPACE 2>/dev/null; then
          echo "Cleaning up PR environment: $PR_NAMESPACE"
          oc delete project $PR_NAMESPACE
        else
          echo "PR environment $PR_NAMESPACE not found, nothing to cleanup"
        fi

  # Notify deployment status
  notify:
    runs-on: ubuntu-latest
    name: Notify Deployment Status
    needs: [deploy-helm]
    if: always()
    
    steps:
    - name: Notify Success
      if: needs.deploy-helm.result == 'success'
      run: |
        echo "✅ Deployment completed successfully!"
        echo "OpenTelemetry Demo is now running in the development environment."
        
    - name: Notify Failure
      if: needs.deploy-helm.result == 'failure'
      run: |
        echo "❌ Deployment failed!"
        echo "Please check the logs and retry the deployment."
        exit 1